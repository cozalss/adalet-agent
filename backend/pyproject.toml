[project]
name = "adalet-backend"
version = "0.1.0"
description = "ADALET-AGENT Python backend — FastAPI + LangGraph + RAG + Multimodal"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",

    # Agents
    "langgraph>=0.2.40",
    "langchain-core>=0.3.10",

    # Retrieval
    "qdrant-client>=1.12.0",
    "redis>=5.1.1",
    "FlagEmbedding>=1.3.2",
    "rank-bm25>=0.2.2",
    "tenacity>=9.0.0",
    "rapidfuzz>=3.10.0",
    "beautifulsoup4>=4.12.3",

    # Multimodal
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",
    "numpy>=2.1.2",

    # Predictive (opsiyonel — devre dışı bırakmak için kaldırabilirsin)
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "scikit-learn>=1.5.2",

    # Observability
    "langfuse>=2.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "retrieval", "multimodal", "predictive"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
