[project]
name = "adalet-backend"
version = "0.1.0"
description = "ADALET-AGENT Python backend — FastAPI + LangGraph + RAG + Multimodal"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    # Agents
    "langgraph>=0.2.40",
    "langchain-core>=0.3.10",
    # Retrieval
    "qdrant-client>=1.12.0",
    "redis>=5.1.1",
    "FlagEmbedding>=1.3.2",
    "rank-bm25>=0.2.2",
    "tenacity>=9.0.0",
    "rapidfuzz>=3.10.0",
    "beautifulsoup4>=4.12.3",
    # Multimodal
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",
    "numpy>=2.1.2",
    # Predictive (opsiyonel — devre dışı bırakmak için kaldırabilirsin)
    # NOT: torch CUDA 12.4 wheel'ı için [tool.uv.sources] aşağıda — RTX 4070 GPU.
    # torch 2.6+ şart: BGE-M3 + FlagEmbedding CVE-2025-32434 fix için torch.load v2.6+ istiyor.
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers>=4.45.0",
    "scikit-learn>=1.5.2",
    "sentence-transformers>=3.2.0",
    # Observability
    "langfuse>=2.50.0",
    "snowballstemmer>=3.1.0",
    "pyjwt>=2.13.0",
    # Sprint-5 W16: APScheduler — Resmi Gazete + Yargıtay delta refresh cron
    "apscheduler>=3.10.4",
    "faster-whisper>=1.2.1",
    "piper-tts>=1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]
# Sprint-4 eval ek — Ragas + Cohere rerank A/B (opsiyonel)
eval = [
    "ragas>=0.2.0",
]
rerank-cohere = [
    "cohere>=5.11.0",
]
# Sprint-5 multimodal — STT (faster-whisper) ve TTS (Piper) opsiyonel,
# CI'da kurulmaz; production'da kullanıcı çekecek. pytesseract zaten core.
multimodal = [
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
]
# Sprint-7/8 — GraphRAG (NetworkX) + LoRA fine-tune (PEFT). CI'da kurulmaz.
graph = [
    "networkx>=3.3",
]
# Production LLM — llama-cpp-python (Qwen 2.5 14B Q4_K_M GGUF için).
# Kurulum: uv pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu124
llm = [
    "llama-cpp-python>=0.3.0",
]
lora = [
    "peft>=0.13.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyTorch CUDA 12.4 wheel index — RTX 4070 GPU için
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["agents", "retrieval", "multimodal", "predictive"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Sprint-4 W5.2: strict kategori seti.
# Eklenenler (W5): A (built-in shadow), C4 (comprehensions), PIE, PT (pytest),
#   RET (return), TID (banned imports), PERF (performance), ASYNC.
# Sprint-6 W6.5 (kod hijyeni 10/10): C901 (complexity gate), S (security),
#   TCH (TYPE_CHECKING), ARG (unused args), ERA (commented-out code).
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "A", "C4", "PIE", "PT", "RET", "TID", "PERF", "ASYNC",
    "C901", "S", "TC", "ARG", "ERA",
]
# Complexity threshold — C901
# Fonksiyon başına max 12; üstündekiler refactor istemeli.
# RaptorIndex.build C (13), _cluster_nodes C (13) hâlâ refactor borçları.
# Şu an 15'te tutuyoruz, Sprint-7'de 10'a indir.
# RUF001/002/003: Türkçe karakter ambiguous uyarıları — proje Türkçe, kapalı
# B008: FastAPI Depends() default ile zorunlu, ignore
# A003: class attribute named id/type — Pydantic gerek
# PERF203: try/except in loop — RARR-lite gibi yerlerde kasıtlı
# PERF401: manual list-comprehension — okunabilirlik kritik kod yerlerinde tercih edilen
# B905: zip without strict — Python 3.11+ default değişti, sweep'ler henüz yapılmadı
# N814: CamelCase-as-constant — pytest fixtures içinde standart
# RET504: unnecessary-assign — okunabilirlik kasıtlı
# RUF034: useless-if-else — koşullu fallback'lerde okunabilir
# S101: assert kullanımı — pytest test'lerinde standart (per-file zaten ignore)
# S104: 0.0.0.0 bind — Docker default
# S105/S106/S107: hardcoded password — false positive (placeholder, test fixture)
# S301/S403: pickle — Sprint-4 W3.1 RAPTOR cache, trusted local file
# S311: random non-crypto — eval/test fixtures, crypto kullanmıyoruz
# S324: md5/sha1 — cache key (collision risk değil, security değil)
# S603/S607: subprocess — kontrollü subprocess call (yargi-mcp wrapper)
# TCH001/002/003: TYPE_CHECKING block — Python 3.11 forward refs zaten OK
# ARG001/002: pytest fixture imzasında unused arg standart
ignore = [
    "E501", "RUF001", "RUF002", "RUF003",
    "B008", "A003",
    "PERF203", "PERF401",
    "B905", "N814",
    "RET504", "RUF034",
    "S101", "S104", "S105", "S106", "S107",
    "S301", "S403", "S311", "S324",
    "S603", "S607",
    "TC001", "TC002", "TC003",
    "ARG001", "ARG002",
    "ERA001",  # commented-out code — sprint notları yorum bloğu olarak kalsın
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Test-friendly ignore'lar: PT018 composite assertion, PT019 fixture-param,
# PT006 parametrize-names-wrong-type — fixture pattern'leri proje konvensiyonu
# RUF012: fake test classes inline mutable defaults (test-only fixtures)
"tests/**" = ["PT011", "PT012", "B017", "A001", "PT018", "PT019", "PT006", "RUF012"]
# Scripts: print, top-of-file import, blocking I/O, complexity, silent except.
# Scripts often have one-shot orchestration code; complexity gate Sprint-7'de.
"scripts/**" = ["T201", "E402", "ASYNC210", "ASYNC240", "C901", "S110"]
# Eval scripts — yöneldikleri yer test/script, blocking I/O OK
"eval/**" = ["ASYNC210", "ASYNC240", "E402", "C901"]
# Training pipelines — offline data prep, complexity ileri sprint borcu
"training/**" = ["C901"]
# Retrieval client'ları: pre-condition assertion ve E402 import pattern kasıtlı
"retrieval/**" = ["PT018", "RUF005", "E402"]
# Verify/RARR — verifier_layers re-import pattern E402 kasıtlı
"agents/verifier_layers.py" = ["E402"]
"agents/nodes/verify.py" = ["E402"]
# api/routes/feedback.py — pathlib mkdir async fonksiyonda; basit dosya I/O
"api/routes/feedback.py" = ["ASYNC240"]

# Sprint-4 W5.1: mypy --strict — gradual adoption.
# Global strict aktif; legacy modüller per-module override ile yumuşatıldı.
# Hedef Hafta 6 sonu: tüm override'ları kaldır (TODO eval/runs/W5_changes.md).
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_unused_ignores = false
warn_return_any = false
# scripts/ ve tests/scripts/ paketsiz (no __init__.py) — explicit bases ile
# mypy aynı dosyayı iki farklı modül adıyla görmesin (dual-module hatası).
explicit_package_bases = true
namespace_packages = true

# Test'ler — fixture/AAA pattern'da type annotation şart koşmuyoruz.
# Behavioral coverage zaten 378 test, type-safety production code'da.
[[tool.mypy.overrides]]
module = ["tests.*", "conftest", "scripts.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = false
disable_error_code = [
    "type-arg", "no-untyped-def", "var-annotated", "assignment",
    "arg-type", "call-arg", "attr-defined", "no-any-return",
    "misc", "index", "operator", "union-attr", "return-value",
    "type-var",
]

# Tam strict — Sprint-6 kod hijyeni 10/10 push.
# 3 → 14 modül expand: core/*, api/middleware/*, api/limiter, api/audit, api/pii,
# api/schemas, agents/state, agents/llm, agents/config.
# Bu modüller untyped def / Any return / unused ignore içermez.
[[tool.mypy.overrides]]
module = [
    "agents.verifier_layers", "verifier.rarr", "agents.nodes.draft",
    "core.scheduler", "core.observability",
    "api.limiter", "api.audit", "api.pii", "api.schemas",
    "api.middleware.auth", "api.middleware.sanitize",
    "agents.config", "agents.state", "agents.llm",
]
disallow_untyped_defs = true
disallow_any_generics = true

# Legacy — third-party stub eksiklikleri + dynamic LangGraph state
# Her sprint'te bu listeyi küçültmek hedef.
[[tool.mypy.overrides]]
module = [
    "retrieval.*", "multimodal.*", "predictive.*", "training.*",
    "api.routes.*", "api.session_store", "main", "eval.*",
    "verifier.nli", "verifier.lettuce",
    "agents.graph",
    "agents.nodes.triaj", "agents.nodes.mevzuat", "agents.nodes.emsal",
    "agents.nodes.verify", "agents.nodes.debate", "agents.nodes.finalize",
    "agents.nodes.crag", "agents.nodes.self_rag",
    "agents.verifier_factories",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = false
disable_error_code = [
    "type-arg", "typeddict-item", "typeddict-unknown-key", "arg-type",
    "return-value", "assignment", "call-arg", "var-annotated",
    "operator", "attr-defined", "no-any-return", "misc", "index",
    "union-attr", "no-untyped-call",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Sprint-4 W5.4: coverage gate — measured %80 hedef.
# Hızlı geliştirme için addopts kapalı; CI'da `--cov-fail-under=80` enforce.
markers = [
    "integration: tests requiring external services (qdrant, redis, llama-server)",
    "gpu: tests requiring CUDA GPU",
    "network: tests requiring outbound network access",
    "slow: tests that take longer than 10s",
    "llm_integration: tests requiring a live LLM (llama-server localhost:8080)",
    "multimodal_integration: tests requiring real Whisper/Piper models on disk",
]

[tool.coverage.run]
# Sprint-4 W5.4: coverage scope — sadece unit test'lerle ölçülen modüller.
# Pure-integration modülleri (HTTP client, vector store) omit edildi:
# bunlar `@pytest.mark.integration` ile gece koşulur, unit test'te coverage'ı düşürür.
source = ["agents", "verifier", "api"]
omit = [
    "tests/*",
    "scripts/*",
    "*/multimodal/*",
    "*/predictive/*",
    "*/training/*",
    "*/eval/*",
    # Integration-only (network/Qdrant/Redis required)
    "*/retrieval/yargi_client.py",
    "*/retrieval/mevzuat_client.py",
    "*/retrieval/vector_store.py",
    "*/retrieval/hybrid_search.py",
    "*/retrieval/hyde.py",
    "*/retrieval/reranker.py",
    "*/retrieval/rerank_provider.py",
    "*/retrieval/chunker.py",
    "*/retrieval/embedding.py",
    "*/retrieval/raptor.py",
    "*/retrieval/raptor_runtime.py",
    "*/retrieval/graph_rag.py",
    # CLI entrypoint
    "main.py",
    # api/routes/multimodal — multimodal preview, lifespan-dependent
    "*/api/routes/multimodal.py",
    "*/api/session_store.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "except ImportError",
    "log\\.warning",
]
show_missing = true
skip_covered = false
# Sprint-4 W5.4: CI gate — coverage düşerse fail.
fail_under = 80
