name: backend-ci

on:
  push:
    branches: [main, develop, "sprint-*"]
    paths:
      - "backend/**"
      - "scripts/**"
      - "supabase/**"
      - "docs/**"
      - "frontend/.env.example"
      - "frontend/src/lib/supabase*.js"
      - "frontend/src/lib/passwordPolicy.js"
      - "frontend/src/hooks/useAuth.js"
      - "frontend/src/pages/AuthPage.jsx"
      - ".env.example"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "supabase/**"
      - "docs/**"
      - "frontend/.env.example"
      - "frontend/src/lib/supabase*.js"
      - "frontend/src/lib/passwordPolicy.js"
      - "frontend/src/hooks/useAuth.js"
      - "frontend/src/pages/AuthPage.jsx"
      - ".env.example"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  # docker-build job'da cache-from/to: type=gha kullanılıyor;
  # GHA cache API için actions:read/write zorunlu.
  actions: write

jobs:
  lint-and-types:
    name: lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies (incl. dev extras)
        run: uv sync --frozen --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: mypy strict
        run: uv run mypy . --exclude '\.venv' --exclude tests --exclude scripts

  test-and-coverage:
    name: pytest + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      LLM_MODE: mock
      HYDE_ENABLED: "0"
      MULTI_QUERY_ENABLED: "0"
      PRELOAD_MODELS: "0"
      NLI_FP16: "0"
      LETTUCE_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies (incl. dev extras)
        run: uv sync --frozen --extra dev
      - name: Run pytest with coverage gate ≥ 80%
        run: |
          uv run pytest tests/ \
            --ignore=tests/multimodal \
            --ignore=tests/training \
            --ignore=tests/agents/test_real_llm_e2e.py \
            --cov --cov-report=term --cov-report=xml \
            --cov-fail-under=80 -q
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage.xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  security-scan:
    name: pip-audit + bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies + tools
        run: |
          uv sync --frozen
          uv pip install pip-audit bandit
      - name: pip-audit (dependency vulns)
        # Vuln bulunursa CI KIRILIR (eski `|| true` soft gate kaldırıldı).
        # `--strict` KULLANMA: torch+cu124 (local-version) ve editable proje
        # PyPI'de olmadığından "auditable değil" → strict false-fail verir.
        # Plain pip-audit gerçek vuln'da zaten exit 1 döner (güvenlik kapısı korunur).
        # Düzeltilemeyen transitif vuln için: `--ignore-vuln <ID>` (gerekçeyle).
        #   CVE-2025-69872 (diskcache 5.6.3): upstream fix YOK (proje dormant,
        #   5.6.3 son sürüm); yalnız opsiyonel eval/llm extra'larından gelen
        #   transitif dep. Fix çıkınca kaldır.
        run: uv run pip-audit --ignore-vuln CVE-2025-69872
      - name: bandit (source vulns)
        # pyproject.toml [tool.bandit] exclude_dirs — CLI --exclude .venv
        # pattern match etmiyordu; config file sağlam.
        run: uv run bandit -r . -c pyproject.toml -ll -ii

  eval-gate:
    name: sıfır-halüsinasyon kalkanı (scorecard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      LLM_MODE: mock
      PRELOAD_MODELS: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --frozen
      - name: Deterministik kalkan regresyon kapısı
        # LLM/GPU/ağ GEREKMEZ — kural/regex/eşik-tabanlı içerik-risk detektörleri.
        # Yanlış-veto>0 (iyi cevabı reddetme) VEYA halüsinasyon-recall<1.0 VEYA
        # precision<1.0 olursa exit 1 → CI KIRILIR. "Uydurmama" iddiasının metrik kapısı.
        run: uv run python -m eval.scorecard --check

  readiness-gates:
    name: production readiness + live contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Production readiness gate
        run: python scripts/check_production_readiness.py
      - name: Multimodal/training/live integration contract gate
        run: python scripts/check_live_integrations.py
      - name: Documentation drift gate
        run: python scripts/check_docs_consistency.py

  docker-build:
    name: docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-types]
    steps:
      - uses: actions/checkout@v4
      # GH Actions ubuntu-latest ~14GB free; torch CUDA 12.4 wheel (~3GB) + uv cache +
      # builder katmanları + load:true tarball export (imajı 2× yazar) kolayca taşar →
      # "no space left on device". Manuel rm (~20GB) yetmedi → jlumbroso ile ~30GB boşalt
      # (tool-cache + android + dotnet + haskell + large-packages + swap). docker-images:
      # false — buildx/docker daemon'ı bozmasın.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          # load: imajı yerel docker daemon'a yükle → ardından `docker run` boot-smoke.
          load: true
          tags: adalet-backend:ci
          # Yalnız linux/amd64 — multi-arch manifest export 2-3 dk fazla sürüyor,
          # smoke test için tek platform yeterli.
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot smoke (#19 — konteyner ayağa kalkıyor + /health 200)
        # Build başarısı startup'ı garanti ETMEZ (import-time/lifespan hatası, bozuk entrypoint
        # build'i geçer ama boot'ta çöker). Mock LLM + model preload kapalı + auth kapalı (ENV=ci,
        # production fail-fast tetiklenmez); lifespan Qdrant/Redis'i fail-soft lazy ele alır.
        run: |
          docker run -d --name adalet-ci -p 8000:8000 \
            -e LLM_MODE=mock -e PRELOAD_MODELS=0 -e AUTH_ENABLED=0 -e ENV=ci \
            adalet-backend:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          echo "---- konteyner logları (son 50) ----"; docker logs --tail 50 adalet-ci || true
          docker rm -f adalet-ci >/dev/null 2>&1 || true
          if [ "$ok" != "1" ]; then echo "BOOT SMOKE BAŞARISIZ: /health 60s içinde 200 dönmedi"; exit 1; fi
          echo "BOOT SMOKE OK"
      - name: Trivy imaj güvenlik taraması (#38)
        # Üretim imajındaki bilinen CVE'leri tara. ignore-unfixed → yalnız DÜZELTİLEBİLİR
        # HIGH/CRITICAL'da kır (actionable; base-image'ın düzeltilemez CVE'leri CI'ı bloklamaz).
        # NOT: base image digest-pin ayrı iş (gerçek digest gerekir).
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: adalet-backend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
