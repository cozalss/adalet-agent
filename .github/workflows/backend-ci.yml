name: backend-ci

on:
  push:
    branches: [main, develop, "sprint-*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  # docker-build job'da cache-from/to: type=gha kullanılıyor;
  # GHA cache API için actions:read/write zorunlu.
  actions: write

jobs:
  lint-and-types:
    name: lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies (incl. dev extras)
        run: uv sync --frozen --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: mypy strict
        run: uv run mypy . --exclude '\.venv' --exclude tests --exclude scripts

  test-and-coverage:
    name: pytest + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      LLM_MODE: mock
      HYDE_ENABLED: "0"
      MULTI_QUERY_ENABLED: "0"
      PRELOAD_MODELS: "0"
      NLI_FP16: "0"
      LETTUCE_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies (incl. dev extras)
        run: uv sync --frozen --extra dev
      - name: Run pytest with coverage gate ≥ 80%
        run: |
          uv run pytest tests/ \
            --ignore=tests/multimodal \
            --ignore=tests/training \
            --ignore=tests/agents/test_real_llm_e2e.py \
            --cov --cov-report=term --cov-report=xml \
            --cov-fail-under=80 -q
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage.xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  security-scan:
    name: pip-audit + bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies + tools
        run: |
          uv sync --frozen
          uv pip install pip-audit bandit
      - name: pip-audit (dependency vulns)
        run: uv run pip-audit --strict || true
      - name: bandit (source vulns)
        # pyproject.toml [tool.bandit] exclude_dirs — CLI --exclude .venv
        # pattern match etmiyordu; config file sağlam.
        run: uv run bandit -r . -c pyproject.toml -ll -ii

  docker-build:
    name: docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-types]
    steps:
      - uses: actions/checkout@v4
      # GH Actions ubuntu-latest ~14GB free; torch CUDA 12.4 wheel (~3GB) +
      # uv cache + builder katmanları kolayca taşar → "no space left on device".
      # Kullanılmayan ön-yüklü SDK'ları sil.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: adalet-backend:ci
          # Yalnız linux/amd64 — multi-arch manifest export 2-3 dk fazla sürüyor,
          # smoke test için tek platform yeterli.
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
