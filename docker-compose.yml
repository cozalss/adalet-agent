  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   volumes:
  #     - ./models:/models:ro
  #   command:
  #     - "-m"
  #     - "/models/qwen2.5-14b-q4_k_m.gguf"
  #     - "--ctx-size"
  #     - "8192"
