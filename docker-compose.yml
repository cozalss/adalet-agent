networks:
  adalet-net:
    driver: bridge
    # Trafiği container içine kapat (host port expose YOK)
    internal: false  # backend public 8000'i için false; backend dışı servis dışarı çıkmaz

volumes:
  qdrant_data:
  redis_data:
  hf_models:
  feedback_logs:
  # caddy_data:   # W9
  # caddy_config: # W9
