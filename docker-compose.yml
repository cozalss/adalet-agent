name: adalet-agent

# ============================================================================
#  ADALET-AGENT — production compose stack (Sprint-4 W7 hardening)
#
#  Hardening:
#   - Redis password (REDIS_PASSWORD env şart) + 6379 internal only
#   - Qdrant API key (QDRANT_API_KEY env) + internal only
#   - Backend: read-only fs, cap_drop ALL, security_opt no-new-privileges
#   - Tmpfs /tmp (writable) — uploads ve temp file için
#   - Resource limits ile DoS guard
#   - Caddy/llama-server: production profiliyle aktif (TLS + lokal gerçek LLM)
#
#  ENV (.env ile sağla):
#    REDIS_PASSWORD=<32+ byte random>
#    QDRANT_API_KEY=<32+ byte random>
#    JWT_SECRET=<32+ byte random>
#    AUTH_ENABLED=1
#    API_KEYS_FILE=/run/secrets/api_keys.json (opsiyonel)
# ============================================================================

services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: adalet-qdrant
    restart: unless-stopped
    # Sprint-4 W7.2: API key + internal-only — host'a expose YOK,
    # backend container'ı qdrant.adalet-net üzerinden konuşur.
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY env zorunlu}
      QDRANT__SERVICE__ENABLE_CORS: "false"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - adalet-net
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: adalet-redis
    restart: unless-stopped
    # Sprint-4 W7.1: requirepass + internal-only port (host'a expose YOK).
    # AOF persistence; everysec policy production'da uygun.
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD env zorunlu}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    networks:
      - adalet-net
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: adalet-postgres
    restart: unless-stopped
    # KVKK: veri Türkiye'de (Hetzner) — internal-net, host'a expose YOK.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adalet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env zorunlu}
      POSTGRES_DB: ${POSTGRES_DB:-adalet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - adalet-net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adalet} -d ${POSTGRES_DB:-adalet}"]
      interval: 30s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adalet-backend
    restart: unless-stopped
    # Sprint-4 W7.3: container hardening.
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    tmpfs:
      # /tmp uploads ve native lib write için writable; rest read-only.
      - /tmp:size=512m,mode=1777
      # HF model cache (model preload ile volume tercih edilir; tmpfs fallback)
      - /home/app/.cache:size=128m,mode=0700
    environment:
      # Connection strings — host port değil servis isimi (internal-net).
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      # İlişkisel DB (feedback/api_key/audit/eval). Set EDİLMEZSE dosya fallback.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-adalet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-adalet}
      SESSION_STORE_KIND: redis
      AUTH_ENABLED: ${AUTH_ENABLED:-1}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env zorunlu}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-86400}
      JWT_ISSUER: ${JWT_ISSUER:-adalet-agent}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-adalet-agent-api}
      API_KEYS_FILE: ${API_KEYS_FILE:-}
      SANITIZE_ENABLED: ${SANITIZE_ENABLED:-1}
      PII_ENABLED: ${PII_ENABLED:-1}
      # SIFIR HALÜSİNASYON (CLAUDE.md §1): production'da fail-CLOSED — bir
      # doğrulayıcı (NLI/Lettuce) çökerse cevap reddedilir, sessizce geçmez.
      VERIFY_STRICT: ${VERIFY_STRICT:-1}
      # Güvenlik başlıkları — production HTTPS (reverse proxy/Caddy) arkasında HSTS aç
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-1}
      # /feedback writes — read-only fs altında writable named volume kullan
      FEEDBACK_LOG_DIR: /var/lib/adalet/feedback
      # Production default: lokal llama-server. Dev/test için .env'de
      # LLM_MODE=mock override et veya docker-compose.dev.yml + local uvicorn kullan.
      LLM_MODE: ${LLM_MODE:-llamacpp_server}
      # production profilinde llama-server servisi (adalet-net içi DNS).
      LLM_SERVER_URL: ${LLM_SERVER_URL:-http://llama-server:8080}
      # --- Retrieval stack — TEK DOĞRU KAYNAK (dev .env ile aynı olmalı) ---
      # KRİTİK: EMBEDDING_MODEL ve QDRANT_COLLECTION boyutları UYUŞMALI.
      #   Mursit-Base = 768-dim → adalet_mursit_hybrid (768-dim)
      #   BGE-M3      = 1024-dim → adalet (1024-dim)
      # Uyuşmazlık startup'ta assert_collection_dim() ile fail-fast yakalanır.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-newmindai/Mursit-Base-TR-Retrieval}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-adalet_mursit_hybrid}
      # Domain-aware dual sparse — vergi/trafik/icra için BGE-M3 sparse
      SPARSE_EMBEDDER_MODEL: ${SPARSE_EMBEDDER_MODEL:-BAAI/bge-m3}
      SPARSE_ENABLED_DOMAINS: ${SPARSE_ENABLED_DOMAINS:-vergi,trafik,icra}
      # Adaptive routing + spekülatif retrieval (dev .env ile aynı default)
      ADAPTIVE_ROUTING_ENABLED: ${ADAPTIVE_ROUTING_ENABLED:-1}
      SPECULATIVE_ENABLED: ${SPECULATIVE_ENABLED:-1}
      SPECULATIVE_DEADLINE_S: ${SPECULATIVE_DEADLINE_S:-2.0}
      # Retrieval feature toggles (production default: adaptive routing AÇIK)
      HYDE_ENABLED: ${HYDE_ENABLED:-1}
      MULTI_QUERY_ENABLED: ${MULTI_QUERY_ENABLED:-1}
      ELIGIBILITY_ENABLED: ${ELIGIBILITY_ENABLED:-0}
      DEBATE_LLM_ON_RETRY: ${DEBATE_LLM_ON_RETRY:-0}
      # Mursit dense-only collection → ColBERT YOK (BGE-M3 collection için "1" yap)
      COLBERT_QUERY_ENABLED: ${COLBERT_QUERY_ENABLED:-0}
      MEVZUAT_DOMAIN_FILTER: "1"
      PYTHONUTF8: "1"
    volumes:
      # Model cache (BGE-M3, reranker, NLI) — read-only fs üstüne writable volume
      - hf_models:/models
      # Feedback persist — read-only fs altında named volume (günlük cron rotate)
      - feedback_logs:/var/lib/adalet/feedback
    networks:
      - adalet-net
    ports:
      # Caddy reverse-proxy W9'da bunun önüne girer. Şimdilik host port:
      - "127.0.0.1:8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 8G  # BGE-M3 + reranker + NLI yüklü
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --output
        - /dev/null
        - http://127.0.0.1:8000/health
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  # ============================================================================
  # PRODUCTION profili — TLS (Caddy) + gerçek LLM (llama-server).
  # Tek komut tam stack:   docker compose --profile production up -d
  # Lokal dev için docker-compose.dev.yml + backend local uvicorn kullan.
  # NOT: container-smoke ile doğrulanmadı.
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: adalet-caddy
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - adalet-net
    depends_on:
      - backend

  llama-server:
    # llama.cpp resmi CUDA server image'ı — lokal gguf, bulut LLM YOK (KVKK).
    image: ghcr.io/ggerganov/llama.cpp:server-cuda
    container_name: adalet-llm
    profiles: ["production"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # Model backend/models/ altında (compose repo-root'ta). read-only mount.
      - ./backend/models:/models:ro
    command:
      - "-m"
      - "/models/${LLAMA_MODEL_FILE:-Qwen2.5-14B-Instruct-Q5_K_M.gguf}"
      - "--ctx-size"
      - "8192"
      - "--port"
      - "8080"
      # Internal-only: adalet-net içinde dinler, host'a expose YOK (ports yok).
      - "--host"
      - "0.0.0.0"
      - "-ngl"
      - "${LLAMA_NGL:-99}"   # tüm layer'lar GPU'ya (VRAM yeterliyse)
      - "--flash-attn"
      - "-ctk"
      - "q8_0"
      - "-ctv"
      - "q8_0"
      - "--batch-size"
      - "512"
      - "--ubatch-size"
      - "512"
    networks:
      - adalet-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s   # 14B yükleme ~30-60s
      retries: 3

networks:
  adalet-net:
    driver: bridge
    # Trafiği container içine kapat (host port expose YOK)
    internal: false  # backend public 8000'i için false; backend dışı servis dışarı çıkmaz

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
  hf_models:
  feedback_logs:
  caddy_data:      # production profili (TLS sertifika persist)
  caddy_config:
